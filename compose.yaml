# La API inicia con pepinos y bacterias. El modelo de agua es opcional; ver
# compose.water.yaml cuando se disponga de sus pesos.
services:
  api:
    build: ./backend/modelos/Bacteria_multitask
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      API_KEY: ${API_KEY:-}        # protege solo /predict/water
      MODEL_C_DIR: /models
    restart: unless-stopped
