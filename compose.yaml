# Un solo contenedor con los tres modelos (pepinos, bacterias y agua) en el puerto 8000.
services:
  api:
    build: ./backend/modelos/Bacteria_multitask
    ports:
      - "8000:8000"
    environment:
      API_KEY: ${API_KEY:-}        # protege solo /predict/water
      MODEL_C_DIR: /models
    volumes:
      # pesos del modelo de agua: model_c.onnx, classes.json, model_config.json
      - ./backend/modelos/Bacteria_multitask/model/model_c:/models:ro
    restart: unless-stopped
