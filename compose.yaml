services:
  cucumber-api:
    build:
      context: .
      dockerfile: Dockerfile.cucumber
    ports:
      - "8001:8000"
    restart: unless-stopped

  bacteria-api:
    build:
      context: .
      dockerfile: Dockerfile.bacteria
    ports:
      - "8002:8000"
    restart: unless-stopped

  water-api:
    build:
      context: .
      dockerfile: Dockerfile.water
    ports:
      - "8003:8000"
    environment:
      API_KEY: ${WATER_API_KEY:-}
    volumes:
      - type: bind
        source: ./model/model_c
        target: /models
        read_only: true
    restart: unless-stopped